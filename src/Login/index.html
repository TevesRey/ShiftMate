<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main-container">

    <div class="left-side">

        <div class="form-box">

            <h1>SHIFTMATE</h1>
            
            <form action="signup.php"
                  method="POST"
                  onsubmit="return check_password";>

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                   
                >

            

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                   
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                   
                >

                <label>Repeat Password</label>

                <input
                    type="password"
                    id="repeat_password"
                   
                >
                <button type="submit" name="signup">
                    CREATE ACCOUNT
                </button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
